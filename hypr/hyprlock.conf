$wall = ~/Pictures/wallpapers/pixel_night_city_static.png

# GENERAL
general {
  no_fade_in = true
  grace = 1
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

# BACKGROUND
background {
    monitor = 
    path = $wall
    # path = screenshot
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

# TIME HH
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba(255, 255, 255, 1)
    # color = $p1_accent_4_rgba
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 120
    font_family = SpaceMono Nerd Font Mono 
    position = 0, -250
    halign = center
    valign = top
    zindex = 5
}

# TIME MM
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    # color = rgba(255, 255, 255, 1)
    color = rgba(80, 200, 216, 1)
    font_size = 120
    font_family = SpaceMono Nerd Font Mono 
    position = 0, -380
    halign = center
    valign = top
    zindex = 5
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = rgba(255, 255, 255, 1)
    # color = $p3_accent_6_rgba
    font_size = 16
    font_family = SpaceMono Nerd Font Mono Bold
    position = 0, -60
    halign = center
    valign = center
    zindex = 5
}

# USER
label {
    monitor =
    text =  $USER
    color = rgba(255, 255, 255, 1)
    font_size = 24
    font_family = Pixelify Sans
    position = 0, -220
    halign = center
    valign = center
}
# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 0
    outer_color = rgba(175, 140, 242, 1)
    dots_size = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 1 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(175, 140, 242, 1)
    fade_on_empty = false
    placeholder_text = 
    # invert_numlock = true # change color if numlock is off
    # capslock_color = 1
    # numlock_color = 1
    # bothlock_color = 1 
    hide_input = false
    position = 0, -280
    halign = center
    valign = center
    zindex = 20
    fail_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    check_text = Authenticating...
    fail_text = <span color="red">Authentication Failed</span>
    font_family = Pixelify Sans
    fail_transition = 0
}

